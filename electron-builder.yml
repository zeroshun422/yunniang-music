appId: com.yunniang.music
productName: 云娘音乐
copyright: Copyright © 2026 yunniang

# 打包时写入 app-update.yml 的配置（同时决定 latest-linux.yml 的生成与上传目标）。
# 注意：程序运行时 electron/updater.ts 会调用 autoUpdater.setFeedURL() 覆盖这里，
# 把更新源切到 v4.gh-proxy.org 加速镜像（generic provider）。这里保留 github
# provider 作为元数据生成依据与直连回退配置，勿随意改成 generic。
publish:
  provider: github
  owner: zeroshun422
  repo: yunniang-music
  releaseType: release

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - resources/**/*
  - package.json
  - node_modules/NeteaseCloudMusicApi/**/*
  - "!node_modules/NeteaseCloudMusicApi/public/**"
  - "!node_modules/NeteaseCloudMusicApi/**/*.md"
  - "!node_modules/NeteaseCloudMusicApi/**/*.test.js"
  - "!node_modules/NeteaseCloudMusicApi/test/**"

# 内嵌 API 模块必须留在 asar 内，这样它能正常解析 express 等依赖
asar: true

linux:
  target:
    - AppImage
    - deb
  category: AudioVideo;Audio;Player
  icon: resources/icon.png
  executableName: yunniang-music
  # electron-builder 26: 用 desktopName 关联窗口与 .desktop 条目
  syncDesktopName: true
  # Cinnamon/GNOME 用 WM_CLASS 关联窗口与图标，必须与 main.ts 里 app.setName 一致
  desktop:
    entry:
      Name: 云娘音乐
      Comment: 网易云音乐 Linux 桌面客户端
      Categories: AudioVideo;Audio;Player;
      Keywords: music;netease;player;audio;
      StartupWMClass: yunniang-music
      StartupNotify: "true"
      Terminal: "false"
  synopsis: 网易云音乐 Linux 桌面客户端
  description: 云娘音乐 — 支持账号登录、无损音质、每日推荐、私人雷达、心动模式、私人漫游等功能的网易云音乐桌面客户端。
  maintainer: yunniang <yunniang@example.com>

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libsecret-1-0
  afterInstall: build/after-install.sh

# 关键：文件名必须是纯 ASCII，且与 latest-linux.yml 里的 url 完全一致。
# 用 ${productName} 会得到中文「云娘音乐」，builder 为兼容 GitHub 会改写成
# YunniangMusic-... 作为附件名，但 yml 里记录的仍是 ${name} 形式的
# yunniang-music-...，两者不一致会让 electron-updater 下载 404。
appImage:
  artifactName: ${name}-${version}-${arch}.AppImage
