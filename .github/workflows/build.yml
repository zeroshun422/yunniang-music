name: Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # GitHub Actions 访问 GitHub Releases 正常，但显式指定更稳
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Ensure electron binary
        run: |
          # 只检查文件是否存在，不执行 electron（CI 中缺 SUID sandbox 会崩溃）
          if [ ! -x node_modules/electron/dist/electron ]; then
            echo "electron 二进制缺失，重新下载"
            node node_modules/electron/install.js
          fi
          ls -la node_modules/electron/dist/electron
          echo "electron binary OK"

      - name: Type check
        run: npx tsc --noEmit
        continue-on-error: false

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      # 最小冒烟：用 mock 数据渲染全部路由，检查页面非空白且无控制台报错
      # Ubuntu runner 无显示服务，需要 xvfb
      - name: Smoke test (mock UI render)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          xvfb-run -a --server-args="-screen 0 1360x900x24" npm run smoke

      - name: Upload smoke screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: /tmp/ui-shots
          retention-days: 7
          if-no-files-found: ignore

      - name: Package (AppImage + deb)
        run: npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CI 环境无需代码签名，避免额外依赖
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/*.AppImage
            release/*.deb
          retention-days: 14
